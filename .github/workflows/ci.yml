name: CI

on:
  push:
    branches: [master]
    paths:
      - 'summarizer/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.pre-commit-config.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install uv
      - run: uv sync --extra dev
      - run: uv run pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install uv
      - run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t obsidian-vexa-bridge:ci .
      - name: Smoke test (Python 3.11 + deps import + summarizer package import inside the image)
        run: |
          docker run --rm obsidian-vexa-bridge:ci python -c "import sys; assert sys.version_info[:2]==(3,11), sys.version; import litellm, aiohttp, asyncpg; import summarizer.__main__; print('image OK', sys.version)"
