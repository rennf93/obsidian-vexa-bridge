# ── Add this service to your Vexa docker-compose.yaml (same indentation as the
#    other services) so the sink adapter can reach `api-gateway` in-stack and
#    the NAS ollama container on the external `ollama_default` network.
#    Use the prebuilt image, or build from a local checkout.
#    Keep VEXA_API_KEY / tokens in a gitignored .env — never inline secrets.

  obsidian-vexa-bridge:
    image: renzof93/obsidian-vexa-bridge:latest
    # Or build from a local checkout instead of the prebuilt image:
    # build:
    #   context: ./obsidian-vexa-bridge
    environment:
      VEXA_API_URL: http://api-gateway:8000          # in-stack; no LAN IP
      VEXA_API_KEY: "${VEXA_SUMMARIZER_TOKEN}"        # per-user tx token, minted once
      SUMMARIZE_PLATFORMS: "discord,google_meet,zoom" # all platforms — Zoom parity is this one var
      MIN_TRANSCRIPT_SECONDS: "30"
      AI_MODEL: "openai/qwen2.5:7b"                   # whatever you `ollama pull` on the NAS
      AI_BASE_URL: "http://ollama:11434/v1"           # NAS ollama container (ollama_default net)
      AI_API_KEY: "not-needed"                        # ollama ignores it; litellm requires a value
      OBSIDIAN_ENABLED: "true"
      OBSIDIAN_SINK: "fs"
      VAULT_DIR: "/vault"
      OBSIDIAN_NOTE_FOLDER: "Meetings"
      INCLUDE_TRANSCRIPT: "true"
      POLL_INTERVAL_SECONDS: "180"
      STATE_DIR: "/data/state"
    depends_on: [api-gateway]
    volumes:
      # Bind mount — Syncthing shares this host folder into the Mac vault.
      - /volume1/vexa-obsidian-notes:/vault
      # state.json idempotency: which meetings are already summarized. Named volume
      # so it survives image updates and `compose up -d` pulls.
      - obsidian-state:/data/state
    networks: [vexa, ollama]                           # ollama = external ollama_default
    restart: unless-stopped

# And declare these at the top level of your docker-compose.yaml:
#   networks:
#     ollama:
#       name: ollama_default
#       external: true
#   volumes:
#     obsidian-state:
