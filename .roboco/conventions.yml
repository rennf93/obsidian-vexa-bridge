# Architectural conventions for this project.
# Auto-scaffolded by RoboCo — edit freely; this file is canonical.
# Each module lists definition KINDS forbidden in it; rules toggle
# warn/block; waivers are accountable, PR-reviewed escape hatches.
version: 1
languages:
- python
modules: []
rules:
  god_class:
    level: warn
  thin_routes:
    level: block
  modular_cohesion:
    level: block
  no_inline_comments:
    level: warn
  no_lint_suppressions:
    level: block
custom:
- id: discord-vexa-bridge
  pattern: discord\-vexa\-bridge
  message: 'Python**: pinned to **3.11** for parity with `discord-vexa-bridge` (not
    load-bearing here — no `audioop` — but kept so the adapter pair stays symmetric).
    Do not bump the runtime or base image past 3.11.'
  level: warn
  languages: []
- id: tests
  pattern: tests/
  message: '`tests/` — unit tests (pytest, asyncio_mode=auto). No network or live
    Vexa required; the HTTP seams are monkeypatched.'
  level: warn
  languages: []
- id: summarizer
  pattern: summarizer/
  message: Match the surrounding style. The docstrings in `summarizer/` document the
    idempotency / poison model and the sink contract — keep them accurate; don't strip
    them.
  level: warn
  languages: []
- id: vexa-api-key
  pattern: VEXA_API_KEY
  message: Never commit secrets. `VEXA_API_KEY` / `VEXA_SUMMARIZER_TOKEN`, `AI_API_KEY`,
    `OBSIDIAN_MCP_TOKEN`, `.env`, and `.env.*.local` are runtime config and gitignored.
  level: warn
  languages: []
- id: v1
  pattern: /v1
  message: The LLM routes through an OpenAI-compatible `/v1` endpoint. On the NAS
    use `http://ollama:11434/v1` with `AI_MODEL=openai/<pulled-model>` and `AI_API_KEY=not-needed`
    (ollama ignores the key; LiteLLM requires a value). Plain `ollama/*` ids hit `/api/generate`
    and the local raw models have no chat template — use the `openai/` prefix.
  level: warn
  languages: []
- id: mark-done
  pattern: mark_done
  message: 'The invariant: `mark_done` is the only commit and it runs last. `create_note`''s
    fail-if-exists and `write_note_fs`''s "file already exists" no-op are the crash-recovery
    backstops across both sinks — don''t weaken them to overwrites, or a crash mid-pass
    can duplicate or clobber a note.'
  level: warn
  languages: []
waivers: []
